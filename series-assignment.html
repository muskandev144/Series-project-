<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Series Page - Muskan</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a1a2e;
    color: #f0f0f0;
    text-align: center;
    padding: 20px;
  }
  h1 {
    color: #ff9800;
  }
  audio {
    margin: 20px auto;
    display: block;
  }
  .video-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
  }
  .video-box {
    background: #16213e;
    padding: 10px;
    border-radius: 10px;
    width: 300px;
  }
  .video-box video {
    width: 100%;
    border-radius: 8px;
  }
  .video-box span {
    display: block;
    margin-top: 8px;
    font-weight: bold;
    color: #e94560;
  }
</style>
</head>
<body>

  <h1>My Favorite Series</h1>

  <!-- Background/Intro Audio -->
  <audio controls>
    <source src="audio/intro.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <!-- 6 Video Episodes -->
  <div class="video-container">

    <div class="video-box">
      <video controls>
        <source src="videos/episode1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <span>Episode 1</span>
    </div>

    <div class="video-box">
      <video controls>
        <source src="videos/episode2.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <span>Episode 2</span>
    </div>

    <div class="video-box">
      <video controls>
        <source src="videos/episode3.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <span>Episode 3</span>
    </div>

    <div class="video-box">
      <video controls>
        <source src="videos/episode4.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <span>Episode 4</span>
    </div>

    <div class="video-box">
      <video controls>
        <source src="videos/episode5.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <span>Episode 5</span>
    </div>

    <div class="video-box">
      <video controls>
        <source src="videos/episode6.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <span>Episode 6</span>
    </div>

  </div>

</body>
</html>
