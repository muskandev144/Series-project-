<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom & Jerry Series - Muskan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #FFF6E5;
    color: #2B2D42;
    padding-bottom: 60px;
  }

  header {
    background: #2B2D42;
    padding: 50px 20px 70px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 40px;
    background: #FFF6E5;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: #F4A300;
    letter-spacing: 1px;
  }

  header p {
    color: #E9ECEF;
    margin-top: 10px;
    font-size: 1.05rem;
  }

  .meta {
    max-width: 600px;
    margin: -30px auto 40px;
    background: #E63946;
    color: white;
    text-align: center;
    padding: 14px 20px;
    border-radius: 14px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(230, 57, 70, 0.3);
  }

  .grid {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 26px;
  }

  .card {
    background: #FFFFFF;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(43, 45, 66, 0.1);
    border: 3px solid #2B2D42;
  }

  .card-label {
    background: #457B9D;
    color: white;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    padding: 10px 16px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card:nth-child(2n) .card-label { background: #E63946; }
  .card:nth-child(3n) .card-label { background: #F4A300; color: #2B2D42; }

  .card video {
    width: 100%;
    display: block;
    background: #000;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    color: #6c757d;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <header>
    <h1>Tom & Jerry Series</h1>
    <p>A little chase, a little chaos — six episodes to enjoy</p>
  </header>

  <div class="meta">Muskan &nbsp;|&nbsp; 24IT-46 &nbsp;|&nbsp; ByteBuilders</div>

  <div class="grid">

    <div class="card">
      <div class="card-label">🐱 Episode 1</div>
      <video controls>
        <source src="VID_20260926160516.mp4" type="video/mp4">

    </div>

    </div>

    <div class="card">

    </div>

    <div class="card">

    </div>

  <footer>Made for Web Development Assignment</footer>

</body>
</html>
